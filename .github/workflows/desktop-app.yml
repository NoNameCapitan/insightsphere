name: Music DNA Copilot — tests and desktop app

on:
  pull_request:
    paths:
      - "music-dna-copilot/**"
      - ".github/workflows/desktop-app.yml"
  push:
    tags:
      - "music-dna-v*"
    # Branch pushes only do something when the commit message contains
    # "[release]": then the release job tags that commit music-dna-v<VERSION>.
    branches:
      - "**"
    paths:
      - "music-dna-copilot/**"
      - ".github/workflows/desktop-app.yml"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: music-dna-copilot

jobs:
  tests:
    name: Smoke tests (Linux)
    if: >-
      github.event_name != 'push' || startsWith(github.ref, 'refs/tags/') ||
      contains(github.event.head_commit.message, '[release]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile
        run: python -m py_compile run_app.py desktop_app.py app.py api/*.py scripts/*.py scripts/mtr_app/*.py scripts/dna3/*.py scripts/connectors/*.py
      - name: Smoke test (all suites)
        run: python -u scripts/smoke_test.py

  desktop:
    name: Desktop app (${{ matrix.label }})
    needs: tests
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
          - os: macos-latest
            label: macOS (Apple Silicon)
          - os: ubuntu-latest
            label: Linux
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools (build time only; the app stays stdlib-only)
        run: python -m pip install pyinstaller pillow
      - name: Build
        run: python packaging/build_desktop.py
      - name: Check the packaged app runs
        run: python packaging/ci_check_binary.py
      - uses: actions/upload-artifact@v4
        with:
          name: music-dna-copilot-${{ matrix.label == 'macOS (Apple Silicon)' && 'macos' || matrix.label == 'Windows' && 'windows' || 'linux' }}
          path: music-dna-copilot/dist/desktop/*
          if-no-files-found: error

  release:
    name: Publish GitHub release
    if: >-
      startsWith(github.ref, 'refs/tags/music-dna-v') ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[release]'))
    needs: desktop
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Release tag
        id: tag
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "name=music-dna-v$(cat VERSION | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          target_commitish: ${{ github.sha }}
          name: Music DNA Copilot ${{ steps.tag.outputs.name }}
          body_path: music-dna-copilot/packaging/RELEASE_BODY.md
          files: artifacts/*
          fail_on_unmatched_files: true
