name: AI Lead Hunter checks
on:
  push:
    paths: ["ai-lead-hunter/**", ".github/workflows/ai-lead-hunter.yml"]
  pull_request:
    paths: ["ai-lead-hunter/**", ".github/workflows/ai-lead-hunter.yml"]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-lead-hunter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ai-lead-hunter/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
